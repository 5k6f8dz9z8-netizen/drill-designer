.segs { display: flex; background: rgba(118,118,128,0.12); border-radius: 9px; padding: 2px; }
.segs .seg.on { background: #fff; color: #1C1C1E; }
.segs.tight .seg { padding: 4px 8px; font-size: 12px; }
.tabs { display: flex; background: rgba(118,118,128,0.12); border-radius: 9px; padding: 2px; margin-bottom: 10px; }
.tabs .seg { flex: 1; text-align: center; font-size: 13px; }
.tabs .seg.on { background: #fff; color: #1C1C1E; }

.inspector {
  position: absolute; left: 10px; right: 10px; bottom: 10px;
  background: rgba(255,255,255,0.94); backdrop-filter: saturate(180%) blur(20px);
  border-radius: 16px; padding: 10px 12px 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.24);
  display: flex; flex-direction: column; gap: 9px; animation: rise .18s ease-out;
}
@keyframes rise { from { transform: translateY(10px); opacity: 0 } to { transform: none; opacity: 1 } }
.insphead { display: flex; align-items: center; justify-content: space-between; }
.kindname { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
.badge { font-style: normal; font-size: 10px; font-weight: 600; color: #007AFF; background: rgba(0,122,255,0.12); padding: 2px 6px; border-radius: 6px; }
.swatches { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; }
.swatches::-webkit-scrollbar { display: none; }
.sw { width: 26px; height: 26px; border-radius: 13px; flex: 0 0 auto; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12); }
.sw.on { box-shadow: 0 0 0 2px #fff, 0 0 0 4px #007AFF; }
.field { border: none; outline: none; background: rgba(118,118,128,0.12); border-radius: 9px; padding: 9px 11px; font-size: 14px; width: 100%; }
.field.big { font-size: 17px; font-weight: 600; }
.field.small { font-size: 13px; padding: 7px 10px; }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper button { width: 30px; height: 28px; border-radius: 8px; background: rgba(118,118,128,0.12); font-size: 16px; color: #007AFF; }
.lbl { font-size: 12px; color: #6C6C70; }
.moverow { display: flex; flex-direction: column; gap: 6px; }
.carryrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.minibtn { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: #007AFF; background: rgba(0,122,255,0.1); padding: 6px 10px; border-radius: 8px; flex: 0 0 auto; }

.dock { flex: 0 0 auto; background: rgba(255,255,255,0.9); backdrop-filter: saturate(180%) blur(20px); border-top: 0.5px solid rgba(0,0,0,0.12); padding: 8px 10px calc(10px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 7px; z-index: 4; }
.steps { display: flex; gap: 6px; align-items: center; overflow-x: auto; scrollbar-width: none; }
.steps::-webkit-scrollbar { display: none; }
.stepchip { flex: 0 0 auto; min-width: 32px; height: 30px; padding: 0 9px; border-radius: 9px; background: rgba(118,118,128,0.12); font-size: 13px; font-weight: 600; color: #3C3C43; display: grid; place-items: center; }
.stepchip.on { background: #007AFF; color: #fff; }
.stepchip.add { color: #007AFF; }
.stepchip.del { color: #FF3B30; }
.dur { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #6C6C70; }
.dur button { width: 24px; height: 24px; border-radius: 7px; background: rgba(118,118,128,0.12); color: #007AFF; }
.notefield { border: none; outline: none; background: rgba(118,118,128,0.1); border-radius: 9px; padding: 7px 11px; font-size: 13px; width: 100%; }

.transport { display: flex; align-items: center; gap: 10px; }
.play { width: 44px; height: 44px; border-radius: 22px; background: #007AFF; color: #fff; display: grid; place-items: center; box-shadow: 0 3px 12px rgba(0,122,255,0.35); transition: transform .12s; }
.play:active { transform: scale(0.93); }
.scrub { flex: 1; min-width: 40px; accent-color: #007AFF; height: 22px; }

.palette { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.palette::-webkit-scrollbar { display: none; }
.pal { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; font-weight: 500; color: #3C3C43; width: 54px; }
.palicon { width: 44px; height: 36px; border-radius: 12px; background: rgba(118,118,128,0.12); display: grid; place-items: center; transition: transform .12s, background .12s; }
.pal:active .palicon { transform: scale(0.92); background: rgba(118,118,128,0.22); }
.dot { width: 18px; height: 18px; border-radius: 9px; display: block; }
.tri { width: 0; height: 0; border-left: 9px solid transparent; border-right: 9px solid transparent; border-bottom: 16px solid #FF9F0A; display: block; }
.disc { width: 20px; height: 9px; border-radius: 10px / 5px; background: #FFD60A; display: block; }
.gate { display: flex; gap: 10px; align-items: flex-end; }
.gate i { width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 11px solid #FF9F0A; }
.goal { width: 26px; height: 10px; border: 2px solid #6C6C70; border-bottom-color: transparent; border-radius: 3px 3px 0 0; display: block; }
.note { font-size: 16px; font-weight: 700; color: #3C3C43; }

.scrim { position: absolute; inset: 0; background: rgba(0,0,0,0.35); z-index: 45; display: flex; align-items: flex-end; animation: fade .2s ease-out; }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
.sheet { width: 100%; max-height: 86%; background: #F2F2F7; border-radius: 18px 18px 0 0; padding: 8px 14px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; animation: slide .26s cubic-bezier(0.32,0.72,0,1); }
@keyframes slide { from { transform: translateY(100%) } to { transform: none } }
.grabber { width: 36px; height: 5px; border-radius: 3px; background: rgba(60,60,67,0.3); margin: 2px auto 8px; }
.sheethead { display: flex; align-items: center; justify-content: space-between; padding-bottom: 8px; }
.sheethead h2 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.4px; }
.sheetbody { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 4px; }
.listrow { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: #fff; border-radius: 13px; padding: 13px 14px; font-size: 15px; color: #1C1C1E; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
.listrow:active { background: #EDEDF2; }
.listrow.danger { color: #FF3B30; }
.listrow.danger .rowicon { color: #FF3B30; }
.rowicon { flex: 0 0 auto; color: #007AFF; display: grid; place-items: center; min-width: 22px; }
.rowtext { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.rowtext em { font-style: normal; font-size: 12px; color: #8E8E93; }
.chev { flex: 0 0 auto; color: #C7C7CC; }
.mini { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 8px; background: #007AFF; color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.hint { margin: 2px 4px 4px; font-size: 13px; color: #8E8E93; line-height: 1.45; }

/* NB: .gate is already taken by the palette's gate icon — keep this distinct. */
.lockscreen {
  position: absolute; inset: 0; z-index: 60; color: #fff; overflow-y: auto;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 18px; padding: 28px 24px;
  background: radial-gradient(120% 80% at 50% 0%, #0E3524 0%, #071B12 68%, #04100A 100%);
}
.lockbg {
  position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(60% 40% at 50% 22%, rgba(48,196,99,0.18) 0%, rgba(48,196,99,0) 70%),
    radial-gradient(40% 30% at 85% 85%, rgba(10,132,255,0.14) 0%, rgba(10,132,255,0) 70%);
  animation: breathe 9s ease-in-out infinite;
}
@keyframes breathe { 0%,100% { opacity: 0.75 } 50% { opacity: 1 } }
.lockinner {
  position: relative; z-index: 1; width: 100%; max-width: 340px;
  display: flex; flex-direction: column; align-items: center;
}
.lockmark { width: 190px; height: 170px; display: block; animation: markin .7s cubic-bezier(0.22,1,0.36,1) both; }
@keyframes markin { from { opacity: 0; transform: scale(0.92) } to { opacity: 1; transform: none } }
.wordmark {
  margin: 2px 0 0; font-size: 46px; font-weight: 700; letter-spacing: -2px; line-height: 1;
  background: linear-gradient(180deg, #FFFFFF 30%, #B8E6C7 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: risein .6s cubic-bezier(0.22,1,0.36,1) .1s both;
}
.tagline {
  margin: 9px 0 0; font-size: 14px; line-height: 1.4; text-align: center;
  color: rgba(255,255,255,0.58); animation: risein .6s cubic-bezier(0.22,1,0.36,1) .18s both;
}
@keyframes risein { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: none } }
.lockfoot { margin: 14px 0 0; font-size: 12.5px; color: rgba(255,255,255,0.4); animation: risein .6s ease .34s both; }
.gatecard {
  width: 100%; margin-top: 22px; padding: 14px; border-radius: 20px;
  background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14);
  backdrop-filter: blur(14px); box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  animation: risein .6s cubic-bezier(0.22,1,0.36,1) .26s both;
}
.gatecard.shake { animation: shake .4s ease; }
@keyframes shake { 10%,90% { transform: translateX(-2px) } 30%,70% { transform: translateX(4px) } 50% { transform: translateX(-6px) } }
.gateform { display: flex; gap: 8px; width: 100%; }
.gateinput {
  flex: 1; min-width: 0; border: 1px solid rgba(255,255,255,0.1); outline: none; border-radius: 13px;
  padding: 13px 15px; font-size: 16px; background: rgba(0,0,0,0.22); color: #fff; transition: border-color .18s, box-shadow .18s;
}
.gateinput::placeholder { color: rgba(255,255,255,0.38); }
.gateinput:focus { border-color: rgba(10,132,255,0.7); box-shadow: 0 0 0 4px rgba(10,132,255,0.18); }
.gatebtn {
  background: linear-gradient(180deg, #2E97FF, #0A84FF); color: #fff; border-radius: 13px;
  padding: 13px 20px; font-size: 15px; font-weight: 600; flex: 0 0 auto;
  box-shadow: 0 6px 18px rgba(10,132,255,0.4); transition: transform .12s, opacity .18s;
}
.gatebtn:active { transform: scale(0.95); }
.gatebtn:disabled { opacity: 0.35; box-shadow: none; }
.gateerr { margin: 10px 2px 2px; font-size: 13px; color: #FF9F9F; text-align: center; }
.backbtn {
  margin-top: 20px; padding: 12px 22px; border-radius: 13px; font-size: 15px; font-weight: 600;
  background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.16);
}
.adminbox {
  position: relative; z-index: 1; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
  border-radius: 16px; padding: 16px; max-width: 400px; width: 100%; backdrop-filter: blur(10px);
}
.adminbox h3 { margin: 0 0 6px; font-size: 15px; font-weight: 700; }
.adminbox p { margin: 0; font-size: 12.5px; line-height: 1.45; color: rgba(255,255,255,0.6); }
.adminbox b { color: #fff; }
.hashout {
  margin: 10px 0 0; padding: 10px; border-radius: 9px; background: rgba(0,0,0,0.35);
  font-size: 11px; line-height: 1.4; white-space: pre-wrap; word-break: break-all;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #9BE6B4; user-select: all;
}
.lockcard { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
.lockcard h3 { margin: 0 0 6px; font-size: 15px; font-weight: 700; }
.lockcard p { margin: 0; font-size: 13px; line-height: 1.45; color: #6C6C70; }
.lockcard .gateinput { background: rgba(118,118,128,0.12); color: #1C1C1E; border-color: rgba(0,0,0,0.06); }
.lockcard .gateinput::placeholder { color: #8E8E93; }
.lockcard .gateerr { color: #FF3B30; text-align: left; }

/* ------------------------------------------------------------- run mode */
.run {
  position: absolute; inset: 0; z-index: 70; display: flex; flex-direction: column;
  padding: calc(10px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom));
  gap: 10px; color: #fff;
  background: radial-gradient(120% 70% at 50% 0%, #10402C 0%, #071B12 70%, #04100A 100%);
  animation: fade .2s ease-out;
}
.runhead { display: flex; align-items: center; gap: 10px; }
.runtitles { flex: 1; min-width: 0; }
.runtitles h2 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.runtitles span { font-size: 12px; color: rgba(255,255,255,0.5); }
.runtimer {
  flex: 0 0 auto; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums;
  padding: 6px 14px; border-radius: 12px; background: rgba(255,255,255,0.1); color: #fff;
  letter-spacing: -0.5px;
}
.runtimer.nearly { background: rgba(255,159,10,0.22); color: #FFCE7A; }
.runtimer.over { background: rgba(255,59,48,0.25); color: #FF9F9F; animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.55 } }
.runclose { width: 38px; height: 38px; border-radius: 19px; display: grid; place-items: center; background: rgba(255,255,255,0.1); color: #fff; flex: 0 0 auto; }
.runstage { position: relative; flex: 1 1 auto; min-height: 0; display: flex; }
.runpitch { width: 100%; height: 100%; display: block; }
.runpoints {
  position: absolute; inset: 0; background: rgba(4,16,10,0.94); border-radius: 14px;
  padding: 18px; overflow-y: auto; backdrop-filter: blur(6px);
}
.runpoints h3 { margin: 0 0 10px; font-size: 15px; font-weight: 700; }
.runpoints ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 9px; }
.runpoints li { font-size: 16px; line-height: 1.4; color: rgba(255,255,255,0.88); }
.runsetup { margin: 14px 0 0; font-size: 13px; line-height: 1.45; color: rgba(255,255,255,0.55); }
.runnote {
  margin: 0; font-size: 19px; line-height: 1.32; font-weight: 600; text-align: center;
  min-height: 50px; display: flex; align-items: center; justify-content: center;
}
.runpips { display: flex; gap: 6px; justify-content: center; }
.runpip { width: 26px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.22); }
.runpip.on { background: #30C463; }
.runctrls { display: flex; align-items: center; justify-content: center; gap: 22px; }
.runbtn { width: 58px; height: 58px; border-radius: 29px; background: rgba(255,255,255,0.12); color: #fff; display: grid; place-items: center; }
.runbtn:disabled { opacity: 0.28; }
.runbig { width: 74px; height: 74px; border-radius: 37px; background: #30C463; color: #06240F; display: grid; place-items: center; box-shadow: 0 8px 24px rgba(48,196,99,0.35); }
.runbig:active { transform: scale(0.95); }
.runfoot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.runnav { display: flex; gap: 14px; }
.runlink { font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.66); padding: 6px 2px; }
.runlink.strong { color: #6FD98F; }
.runlink:disabled { opacity: 0.3; }

/* --------------------------------------------------------- home & nav */
.home {
  position: absolute; inset: 0; z-index: 30; color: #fff; overflow-y: auto;
  background: radial-gradient(120% 80% at 50% 0%, #0E3524 0%, #071B12 68%, #04100A 100%);
}
.homeinner {
  position: relative; z-index: 1; min-height: 100%; display: flex; flex-direction: column;
  padding: calc(26px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
  max-width: 560px; margin: 0 auto;
}
.homehead { text-align: center; margin-bottom: 22px; animation: risein .5s cubic-bezier(0.22,1,0.36,1) both; }
.wordmark.small { font-size: 34px; }
.homehead .tagline { margin-top: 6px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left;
  padding: 14px; border-radius: 20px; background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.13); backdrop-filter: blur(14px); color: #fff;
  box-shadow: 0 14px 34px rgba(0,0,0,0.28); transition: transform .14s, background .14s;
  animation: risein .5s cubic-bezier(0.22,1,0.36,1) both;
}
.tile:nth-child(2) { animation-delay: .05s }
.tile:nth-child(3) { animation-delay: .1s }
.tile:nth-child(4) { animation-delay: .15s }
.tile:active { transform: scale(0.97); background: rgba(255,255,255,0.11); }
.tileart { width: 100%; margin-bottom: 8px; }
.tileart svg { width: 100%; height: auto; display: block; }
.tiletitle { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
.tilesub { font-size: 11.5px; line-height: 1.35; color: rgba(255,255,255,0.55); }
.tilemeta { margin-top: 6px; font-size: 11px; font-weight: 600; color: #6FD98F; }
.homefoot { margin-top: auto; padding-top: 26px; display: flex; justify-content: center; gap: 20px; }

.screen { position: absolute; inset: 0; z-index: 25; background: #F2F2F7; display: flex; flex-direction: column; }
.screenbar {
  display: flex; align-items: center; gap: 8px; flex: 0 0 auto;
  padding: calc(10px + env(safe-area-inset-top)) 12px 10px;
  background: rgba(255,255,255,0.86); backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 0.5px solid rgba(0,0,0,0.12);
}
.screenbar h2 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.4px; }
.ic.back svg { transform: rotate(180deg); }
.screenhead { padding: 10px 14px 0; background: #F2F2F7; flex: 0 0 auto; }
.screenbody {
  flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
  padding: 12px 14px calc(20px + env(safe-area-inset-bottom));
}

.formwrap { background: #0E3524; border-radius: 14px; padding: 8px; }
.formpitch { width: 100%; max-height: 46vh; display: block; }
.rolecard { background: #fff; border-radius: 13px; padding: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
.rolecard h3 { margin: 0 0 6px; font-size: 15px; font-weight: 700; }
.rolecard p { margin: 0; font-size: 13.5px; line-height: 1.45; color: #3C3C43; }
.rolecard .muted { color: #8E8E93; }

.qcard {
  background: #fff; border-radius: 13px; padding: 13px 14px; display: flex; flex-direction: column; gap: 9px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.05);
}
.qlabel { font-size: 14px; font-weight: 600; color: #1C1C1E; }
.sliderow { display: flex; align-items: center; gap: 12px; }
.qslider { flex: 1; min-width: 0; accent-color: #007AFF; height: 26px; }
.sliderow b { min-width: 62px; text-align: right; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }

.searchfield {
  width: 100%; border: none; outline: none; background: #fff; border-radius: 11px;
  padding: 11px 14px; font-size: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); margin-bottom: 2px;
}
.starbtn { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 16px; display: grid; place-items: center; color: #C7C7CC; }
.starbtn.on { color: #FFB800; }
.starbtn.on svg { fill: currentColor; }
.chip.star { display: inline-flex; align-items: center; gap: 5px; }
.chip.star.on svg { fill: currentColor; }

.filters { display: flex; flex-direction: column; gap: 6px; margin-bottom: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 6px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 500; background: #fff; color: #3C3C43; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
.chip.on { background: #007AFF; color: #fff; font-weight: 600; }
.lvl { flex: 0 0 auto; width: 24px; height: 24px; border-radius: 12px; color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.meta { display: flex; align-items: center; gap: 9px; font-size: 13px; color: #6C6C70; padding: 0 2px 2px; }

.help { display: flex; flex-direction: column; gap: 10px; }
.help section { background: #fff; border-radius: 13px; padding: 13px 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
.help h3 { margin: 0 0 8px; font-size: 14px; font-weight: 700; letter-spacing: -0.2px; color: #1C1C1E; }
.help ul { margin: 0; padding-left: 17px; display: flex; flex-direction: column; gap: 7px; }
.help li { font-size: 13.5px; line-height: 1.45; color: #3C3C43; }
.help b { color: #1C1C1E; font-weight: 600; }
.legend { width: 100%; max-width: 260px; margin: 12px 0 2px; display: block; }

.sessitem { background: #fff; border-radius: 13px; padding: 11px 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
.sessrow { display: flex; align-items: center; gap: 10px; }
.idx { width: 22px; height: 22px; border-radius: 7px; background: rgba(0,122,255,0.12); color: #007AFF; font-size: 11px; font-weight: 700; display: grid; place-items: center; flex: 0 0 auto; }
.sessname { flex: 1; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.minstep { display: flex; align-items: center; gap: 4px; font-size: 13px; color: #3C3C43; flex: 0 0 auto; }
.minstep button { width: 26px; height: 26px; border-radius: 8px; background: rgba(118,118,128,0.12); color: #007AFF; }
.minstep b { min-width: 34px; text-align: center; font-weight: 600; }
.sessactions { display: flex; gap: 6px; justify-content: flex-end; }

.busy { position: absolute; inset: 0; background: rgba(0,0,0,0.4); z-index: 55; display: grid; place-items: center; }
.busycard { background: rgba(28,28,30,0.95); color: #fff; border-radius: 16px; padding: 20px 26px; display: flex; flex-direction: column; align-items: center; gap: 12px; font-size: 14px; min-width: 190px; }
.spinner { width: 26px; height: 26px; border-radius: 13px; border: 2.5px solid rgba(255,255,255,0.25); border-top-color: #fff; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg) } }
.track { width: 150px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.2); overflow: hidden; }
.track i { display: block; height: 100%; background: #0A84FF; transition: width .15s linear; }

.toast { position: absolute; left: 50%; bottom: 100px; transform: translateX(-50%); background: rgba(28,28,30,0.92); color: #fff; padding: 9px 15px; border-radius: 20px; font-size: 13px; z-index: 60; animation: fade .18s ease-out; backdrop-filter: blur(8px); max-width: 86%; text-align: center; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
